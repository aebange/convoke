<div class="flex flex-col w-full h-full bg-primary p-10 relative">
  <!-- Cancel Button -->
  <div class="flex gap-3 items-center absolute top-5 right-6" (click)="this.closeDialogClicked()">
    <span class="text-white text-lg">Cancel</span>
    <i class="fa-solid fa-xmark-large text-white"></i>
  </div>

  <!-- Content Wrapper -->
  <div class="flex flex-col gap-5 h-full items-center justify-center">

    <!-- Icon -->
    <div class="fa-stack items-center justify-center flex mb-2">
      <i class="fa-solid fa-circle text-6xl text-secondary fa-stack-1x -ml-2"></i>
      <i class="fa-solid fa-door-open text-4xl text-primary fa-stack-2x "></i>
    </div>

    <!-- Title -->
    <span class="text-4xl whitespace-nowrap font-semibold text-white ">Everyone's waiting</span>

    <!-- Subtitle -->
    <span class="text-primary-100 text-center">
      Enter the group name and password your friends sent you.
    </span>

    <!-- Form Fields -->
    <div class="flex flex-col w-full py-5 items-center justify-center">
      <form autocomplete="off" class="flex flex-col w-full" [formGroup]="this.groupForm">

        <!-- Group Name Field -->
        <div class="relative">
          <mat-form-field appearance="outline" floatLabel="always" >
            <mat-label class="!font-bold">Group Name</mat-label>
            <input matInput formControlName="groupName" placeholder="e.g. MIKES-FRIENDS">

            <span matSuffix class="flex items-center">
              <span class="flex items-center pr-4">
                <mat-spinner *ngIf="groupNameStatus === 'pending'"
                             diameter="18"
                             class="group-name-status-spinner"
                             aria-label="Checking group name"></mat-spinner>

                <button *ngIf="groupNameStatus === 'valid'"
                        type="button"
                        data-group-name-status
                        class="flex items-center bg-transparent border-0 p-0 m-0 text-secondary text-lg cursor-help"
                        [attr.aria-label]="groupNameStatusMessage"
                        [attr.aria-expanded]="statusPopoverOpen"
                        [attr.aria-describedby]="statusPopoverOpen ? 'group-name-status-hint' : null"
                        (pointerenter)="onStatusPointerEnter($event)"
                        (pointerleave)="onStatusPointerLeave($event)"
                        (pointerup)="onStatusPointerUp($event)">
                  <i class="fa-solid fa-circle-check"></i>
                </button>

                <button *ngIf="groupNameStatus === 'invalid'"
                        type="button"
                        data-group-name-status
                        class="flex items-center bg-transparent border-0 p-0 m-0 text-red-500 text-lg cursor-pointer"
                        [attr.aria-label]="groupNameStatusMessage"
                        [attr.aria-expanded]="statusPopoverOpen"
                        [attr.aria-describedby]="statusPopoverOpen ? 'group-name-status-hint' : null"
                        (pointerenter)="onStatusPointerEnter($event)"
                        (pointerleave)="onStatusPointerLeave($event)"
                        (pointerup)="onStatusPointerUp($event)">
                  <i class="fa-solid fa-circle-xmark"></i>
                </button>
              </span>
            </span>
          </mat-form-field>

          <div *ngIf="statusPopoverOpen && groupNameStatus !== 'none'"
               id="group-name-status-hint"
               data-group-name-status
               role="status"
               aria-live="polite"
               class="absolute right-4 bottom-full z-20 mb-1 max-w-[260px] rounded-md bg-white px-2.5 py-1.5 text-xs font-semibold text-primary shadow-lg">
            {{ groupNameStatusMessage }}
            <button *ngIf="groupNameControl.hasError('checkFailed')"
                    type="button"
                    class="ml-1 underline"
                    (click)="retryGroupNameCheck()">Retry</button>
          </div>
        </div>


        <!-- Password Field -->
        <mat-form-field appearance="outline" floatLabel="always" >
          <mat-label class="!font-bold">Group Password</mat-label>
          <input matInput type="password" formControlName="groupPassword" placeholder="••••••••">
          <mat-error *ngIf="groupPasswordControl.invalid">{{ passwordErrorMessage }}</mat-error>
          <mat-hint *ngIf="!groupPasswordControl.enabled">Enter a valid group name first</mat-hint>
        </mat-form-field>

      </form>

      <!-- Inline Login Error -->
      <div *ngIf="loginError"
           class="w-full rounded-md border border-red-500 bg-red-500/20 text-white text-sm px-3 py-2 mb-3">
        {{ loginError }}
      </div>

      <!-- Continue Button -->
      <button class="flex transition-all duration-300 bg-secondary text-primary w-full flex-shrink-0 h-[56px]
          self-center rounded-md items-center justify-center
         gap-3 disabled:bg-secondary/25" (click)="this.continueClicked()" [disabled]="!this.canSubmit">
        <mat-spinner *ngIf="this.submitting" diameter="20"></mat-spinner>
        <span *ngIf="!this.submitting" class="font-bold">Continue</span>
        <i *ngIf="!this.submitting" class="fa-solid fa-arrow-right"></i>
      </button>

    </div>

    <!-- Hint -->
    <div class="flex flex-row gap-1 text-primary-400 text-xs text-center">
      <i class="fa-regular fa-question-circle mt-0.5"></i>
      <span>
        Can't find your code? Ask your host, <span class="underline">or make your own group from scratch.</span>
      </span>
    </div>

  </div>
</div>
