<!-- Page Wrapper -->
<div class="flex flex-col w-full h-full p-5 gap-5 relative">

  <!-- Title & Subtitle -->
  <div class="flex flex-col -gap-0.5">
    <!-- Title -->
    <div class="text-3xl font-semibold text-primary tracking-tight">
      <span>Welcome back, Alex!</span>
    </div>

    <!-- Subtitle -->
    <div class="text-primary text-sm tracking-wider">
      <span>You have 0 items awaiting review.</span>
    </div>
  </div>

  <!-- Stat Roller -->
  <div class="flex flex-col h-[140px] p-5 w-full justify-between bg-primary rounded-lg text-white" *ngIf="false">
    <!-- Card Title -->
    <span class="tracking-widest uppercase text-sm">Next Group Event</span>
    <!-- Card Value -->
    <span class="text-4xl font-bold">15 Days</span>
    <!-- Card Subtitle -->
    <div class="flex flex-row w-full items-center gap-2">
      <i class="fa-solid fa-check"></i>
      <span>4 / 7 responses</span>
    </div>
  </div>

  <!-- No Events Card -->
  <div class="flex flex-col h-[140px] p-5 w-full justify-between border border-dashed border-primary rounded-lg text-primary">
    <!-- Card Title -->
    <span class="tracking-widest uppercase text-sm">No Pending Events</span>
    <!-- Card Value -->
    <span class="text-4xl font-bold">45 Days</span>
    <!-- Card Subtitle -->
    <div class="flex flex-row w-full items-center gap-2">
      <span>Since something has happened</span>
    </div>
  </div>

  <!-- Conditional Create Event Button -->
  <button class="flex w-full h-[70px] gap-4 bg-primary rounded-lg items-center justify-center text-white text-2xl font-bold">
    <i class="fa-solid fa-calendar-plus"></i>
    <span>Create Event</span>
  </button>

  <!-- Create Event Button -->
  <div class="flex absolute w-16 h-16 rounded-full bg-primary bottom-5 right-5 items-center justify-center text-white">
    <i class="fa-solid fa-plus text-lg"></i>
  </div>
</div>
