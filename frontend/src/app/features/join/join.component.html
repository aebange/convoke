<div class="flex flex-col w-full h-full bg-background-primary">

  <!-- App Header -->
  <div class="flex w-full gap-2 h-[50px] border-border-primary bg-primary border-b items-center justify-center">
    <i class="fa-solid fa-comments text-white text-lg"></i>
    <span class="font-extrabold text-white text-2xl">Convoke</span>
  </div>

  <!-- Page Content -->
  <div class="flex flex-col h-full w-full gap-5 p-5">
    <!-- Page Title & Subtitle -->
    <div class="flex flex-col w-full h-[110px] md:h-[320px] items-center justify-center gap-3">

      <!-- Title -->
      <div class="text-3xl md:text-5xl text-primary text-center font-semibold tracking-wide">
        <span class="uppercase">Welcome To <br>Convoke</span>
      </div>

      <!-- Subtitle -->
      <div class="text-primary md:text-2xl text-medium">
        <span>Let's save your social life</span>
      </div>
    </div>

    <!-- Image Carousel Placeholder -->
    <div class="flex w-full h-full justify-around gap-3">

      <!-- Placeholders -->
      <div class="flex w-full bg-secondary h-full w-full rounded-lg"></div>
    </div>

    <div class="flex flex-col w-full gap-5 h-[232px]">
      <!-- Group Name Field -->
      <div class="flex w-full h-[80px] items-center justify-center">
        <form novalidate autocomplete="off" class="flex flex-col w-full" [formGroup]="this.groupForm">
          <span class="form-field-title !pb-1.5">Group Name</span>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput formControlname="groupName" placeholder="Enter Group Name">
          </mat-form-field>
        </form>
      </div>

      <!-- Continue Button -->
      <button class="flex bg-primary w-full h-[56px] self-center rounded-md items-center justify-center
    text-white gap-3 disabled:bg-gray-400 disabled:text-gray-600 transition-all duration-300"
              [disabled]="this.groupForm.invalid">
        <span class="font-bold">Continue</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <!-- Create & Help Buttons -->
      <div class="flex gap-3 w-full h-[56px] self-center">
        <button class="flex bg-blue-500 w-2/3 h-[56px] self-center rounded-md items-center justify-center
  text-white gap-3">
          <span class="font-bold">Create</span>
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="flex border border-primary w-1/3 h-[56px] self-center rounded-md items-center justify-center">
          <span class="font-bold text-primary">About</span>
        </button>
      </div>
    </div>

    <!-- About Link -->

    <!-- Footer -->
  </div>

</div>
